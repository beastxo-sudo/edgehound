name: Arb scan (Polymarket vs Kalshi)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node arbscan.js
      - name: Commit results
        run: |
          git config user.name arb-bot
          git config user.email bot@arb
          git add data/arbscan.json
          git commit -m "Arb scan $(date -u +'%H:%M UTC')" || exit 0
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push origin HEAD:main && break
            sleep 3
          done
