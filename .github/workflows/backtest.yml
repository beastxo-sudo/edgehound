name: Backtest (Polymarket history)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Lookback hours'
        default: '24'

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run backtest
        env:
          BACKTEST_HOURS: ${{ github.event.inputs.hours || '24' }}
        run: node backtest.js
      - name: Commit results
        run: |
          git config user.name "edgehound-bot"
          git config user.email "bot@edgehound"
          git add data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Backtest $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              git fetch origin main && git rebase origin/main || { git rebase --abort 2>/dev/null || true; }
              if git push origin HEAD:main; then break; fi
              sleep $((i*3))
            done
          fi
