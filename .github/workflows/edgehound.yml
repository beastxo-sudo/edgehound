name: EdgeHound paper-trading bot

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may delay a few min)
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: edgehound
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run EdgeHound
        run: node edgehound.js

      - name: Commit journal
        run: |
          git config user.name "edgehound-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "EdgeHound run $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${GITHUB_REF_NAME} || { git rebase --abort 2>/dev/null || true; }
              if git push; then break; fi
              echo "push failed, retry $i"; sleep $((i*3))
            done
          fi
