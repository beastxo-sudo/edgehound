name: Sniper Lab (cheap-underdog strategy)

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may delay a few min)
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  actions: write

concurrency:
  group: edgehound
  cancel-in-progress: false

jobs:
  sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    concurrency:
      group: sniper-lab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Sniper Lab (60s cheap-underdog)
        run: node sniper.js
      - name: Self-audit sniper data
        run: node audit.js || echo "audit completed with findings"
      - name: Commit lab results
        run: |
          git config user.name "edgehound-bot"
          git config user.email "bot@edgehound"
          git add data/sniper.json data/audit.json data/strategy.json
          if ! git diff --cached --quiet; then
            git commit -m "Sniper Lab samples $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${GITHUB_REF_NAME} || { git rebase --abort 2>/dev/null || true; }
              if git push; then break; fi
              echo "push failed, retry $i"; sleep $((i*3))
            done
          fi
