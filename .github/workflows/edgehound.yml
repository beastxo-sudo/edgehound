name: Ledger reconstruction (full coverage)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper-lab
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Reconstruct missing windows from Polymarket history
        env:
          RECON_HOURS: '3'
        run: node reconstruct.js
      - name: Commit ledger
        run: |
          git config user.name "edgehound-bot"
          git config user.email "bot@edgehound"
          git add data/ledger.json data/strategy.json
          git add -u data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Ledger $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              git fetch origin main && git rebase origin/main || { git rebase --abort 2>/dev/null || true; }
              if git push origin HEAD:main; then break; fi
              sleep $((i*3))
            done
          fi
