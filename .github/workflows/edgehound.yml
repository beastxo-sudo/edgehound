name: EdgeHound paper-trading bot

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may delay a few min)
  workflow_dispatch:          # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: edgehound
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run EdgeHound
        run: node edgehound.js

      - name: Commit journal
        run: |
          git config user.name "edgehound-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "EdgeHound run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
